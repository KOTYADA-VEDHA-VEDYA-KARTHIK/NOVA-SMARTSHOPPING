<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="dark">
    <title>NOVA CART | SMARTOPS — Predictive Operations Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        },
                        nova: {
                            orange: '#ff5a1f',
                            dark: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f1f5f9; }
        .glass-panel { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: #131b2e; border: 1px solid rgba(255, 255, 255, 0.06); }
        .glass-card:hover { border-color: rgba(99, 102, 241, 0.4); }
        .toast-enter { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.35s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-badge { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        button:focus-visible, input:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }
        .skip-link { position: absolute; left: -9999px; top: 8px; z-index: 100; background: #4f46e5; color: #fff; padding: 8px 14px; border-radius: 8px; }
        .skip-link:focus { left: 8px; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <noscript>This dashboard requires JavaScript.</noscript>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Reusable Chart Component
        const ChartBox = ({ type, data, options, height = '220px' }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            
            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }
                if (chartRef.current) {
                    chartInstance.current = new Chart(chartRef.current, {
                        type,
                        data,
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            ...options
                        }
                    });
                }
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [data, options, type]);
            
            return <div style={{ position: 'relative', height, width: '100%' }}><canvas ref={chartRef}></canvas></div>;
        };

        // Initial Historical Products Data
        const initialProductsRaw = [
            { id: 'SKU-101', name: 'Amul Taaza Milk 1L', category: 'Dairy & Eggs', currentStock: 20, history: [14, 12, 15, 13, 11, 14, 16, 13, 14, 15, 13, 12, 14, 15] },
            { id: 'SKU-102', name: 'Britannia Whole Wheat Bread', category: 'Bakery', currentStock: 18, history: [7, 9, 8, 6, 8, 9, 7, 8, 9, 7, 8, 10, 8, 7] },
            { id: 'SKU-103', name: 'India Gate Basmati Rice 5kg', category: 'Staples & Grains', currentStock: 42, history: [5, 4, 6, 5, 4, 5, 6, 4, 5, 5, 6, 4, 5, 5] },
            { id: 'SKU-104', name: 'Farm Fresh Eggs (Pack of 12)', category: 'Dairy & Eggs', currentStock: 8, history: [8, 9, 7, 8, 9, 8, 10, 8, 9, 8, 9, 10, 9, 8] },
            { id: 'SKU-105', name: 'Fresh Red Onion 1kg', category: 'Fresh Produce', currentStock: 15, history: [10, 11, 9, 12, 10, 11, 13, 10, 11, 12, 11, 10, 12, 11] },
            { id: 'SKU-106', name: 'Hybrid Tomato 1kg', category: 'Fresh Produce', currentStock: 12, history: [8, 9, 8, 7, 9, 8, 9, 8, 9, 8, 9, 8, 9, 8] },
            { id: 'SKU-107', name: 'Aashirvaad Shudh Chakki Atta 5kg', category: 'Staples & Grains', currentStock: 35, history: [4, 3, 5, 4, 3, 4, 5, 3, 4, 4, 5, 3, 4, 4] },
            { id: 'SKU-108', name: 'Amul Masti Dahi 400g', category: 'Dairy & Eggs', currentStock: 6, history: [9, 10, 8, 11, 9, 10, 11, 9, 10, 11, 10, 9, 11, 10] },
            { id: 'SKU-109', name: 'Robusta Banana (1 Dozen)', category: 'Fresh Produce', currentStock: 9, history: [6, 7, 6, 5, 7, 6, 7, 6, 7, 6, 7, 5, 7, 6] },
            { id: 'SKU-110', name: 'Fortune Sunlite Sunflower Oil 1L', category: 'Staples & Grains', currentStock: 25, history: [3, 2, 3, 4, 3, 2, 3, 3, 2, 3, 4, 3, 2, 3] },
            { id: 'SKU-111', name: 'Tata Salt Vaccum Evaporated 1kg', category: 'Staples & Grains', currentStock: 50, history: [4, 3, 4, 3, 4, 3, 4, 4, 3, 4, 3, 4, 3, 4] },
            { id: 'SKU-112', name: 'Maggi 2-Minute Noodles (Pack of 4)', category: 'Packaged Foods', currentStock: 14, history: [9, 8, 10, 9, 11, 10, 12, 10, 11, 12, 11, 10, 12, 11] },
        ];

        // <logic>
        const RISK_RANK = { HIGH: 3, MEDIUM: 2, LOW: 1 };
        const sortByRisk = (list) => [...list].sort((a, b) => (RISK_RANK[b.risk] || 0) - (RISK_RANK[a.risk] || 0));
        const sanitizeHistory = (h) => (Array.isArray(h) ? h : []).map(Number).filter(n => Number.isFinite(n) && n >= 0);
        const isValidQty = (q) => Number.isInteger(q) && q > 0 && q <= 10000;

        // Transparent Inventory Prediction Algorithm
        const computeInventoryPrediction = (product, forecastDays = 3) => {
            const history = sanitizeHistory(product.history);
            if (history.length < 3) throw new RangeError(`Need at least 3 days of history for ${product.id}`);
            const daysCount = history.length;
            const totalUnitsSold = history.reduce((sum, val) => sum + val, 0);
            const avgDailyDemand = totalUnitsSold / daysCount;
            
            // Trend calculation: recent 3-day average compared to overall average
            const recent3DaysAvg = history.slice(-3).reduce((sum, val) => sum + val, 0) / 3;
            const trendRatio = avgDailyDemand > 0 ? recent3DaysAvg / avgDailyDemand : 1;
            
            let trend = 'STABLE';
            if (trendRatio > 1.06) trend = 'RISING';
            else if (trendRatio < 0.94) trend = 'FALLING';

            // Predicted Demand for 3 days
            const rawPredictedDemand = avgDailyDemand * trendRatio * forecastDays;
            const predictedDemand = Math.round(rawPredictedDemand);
            
            // Safety Buffer (10% of demand)
            const safetyBuffer = Math.ceil(predictedDemand * 0.1);
            const totalRequired = predictedDemand + safetyBuffer;

            // Stockout Risk Categorization
            let risk = 'LOW';
            let riskColor = 'green';
            let action = 'STOCK HEALTHY';

            if (product.currentStock < predictedDemand) {
                risk = 'HIGH';
                riskColor = 'red';
                action = 'RESTOCK NOW';
            } else if (product.currentStock <= totalRequired) {
                risk = 'MEDIUM';
                riskColor = 'amber';
                action = 'RESTOCK SOON';
            } else {
                risk = 'LOW';
                riskColor = 'green';
                action = 'STOCK HEALTHY';
            }

            const recommendedRestock = Math.max(totalRequired - product.currentStock, 0);

            return {
                ...product,
                avgDailySales: avgDailyDemand.toFixed(1),
                trend,
                trendFactor: trendRatio.toFixed(2),
                predictedDemand,
                safetyBuffer,
                totalRequired,
                risk,
                riskColor,
                recommendedRestock,
                action,
                status: product.status || 'ACTIVE'
            };
        };

        // Active Orders for Delivery Risk
        const initialOrdersData = [
            { id: 'ORD-1048', store: 'Fresh Mart (Indiranagar)', distance: 6.8, items: 9, prepTime: 18, storeLoad: 'HIGH', availablePartners: 1 },
            { id: 'ORD-1050', store: 'Sharma Grocery (Koramangala)', distance: 7.2, items: 11, prepTime: 20, storeLoad: 'HIGH', availablePartners: 1 },
            { id: 'ORD-1046', store: 'Metro Bazaar (HSR Layout)', distance: 5.7, items: 8, prepTime: 15, storeLoad: 'HIGH', availablePartners: 1 },
            { id: 'ORD-1044', store: 'Daily Needs (Whitefield)', distance: 4.5, items: 6, prepTime: 12, storeLoad: 'MEDIUM', availablePartners: 2 },
            { id: 'ORD-1047', store: 'Green Valley Organics', distance: 3.9, items: 5, prepTime: 10, storeLoad: 'MEDIUM', availablePartners: 2 },
            { id: 'ORD-1051', store: 'Daily Needs (Jayanagar)', distance: 3.1, items: 4, prepTime: 9, storeLoad: 'MEDIUM', availablePartners: 3 },
            { id: 'ORD-1042', store: 'ABC Supermarket (BTM)', distance: 3.2, items: 4, prepTime: 8, storeLoad: 'LOW', availablePartners: 3 },
            { id: 'ORD-1043', store: 'Fresh Mart (MG Road)', distance: 2.1, items: 3, prepTime: 6, storeLoad: 'LOW', availablePartners: 4 },
            { id: 'ORD-1045', store: 'QuickStop Express (Domlur)', distance: 1.8, items: 2, prepTime: 5, storeLoad: 'LOW', availablePartners: 5 },
            { id: 'ORD-1049', store: 'ABC Grocery (Bellandur)', distance: 2.5, items: 3, prepTime: 7, storeLoad: 'LOW', availablePartners: 3 },
        ];

        // Transparent Delivery ETA & Risk Formula
        const computeDeliveryPrediction = (order, isPrioritized = false) => {
            const SPEED_MIN_PER_KM = 3.0; // Realistic city bike transit speed
            const SLA_TARGET = 30; // 30-minute quick-commerce guarantee target

            const travelTime = Math.round(order.distance * SPEED_MIN_PER_KM);
            
            let workloadPenalty = 0;
            if (order.storeLoad === 'MEDIUM') workloadPenalty = 5;
            else if (order.storeLoad === 'HIGH') workloadPenalty = 12;

            const itemPenalty = order.items > 5 ? Math.round((order.items - 5) * 1.5) : 0;
            const partnerPenalty = order.availablePartners <= 1 ? 6 : 0;

            let prepEffective = order.prepTime;
            let dispatchBoost = 0;

            if (isPrioritized) {
                // Priority lane shaves prep backlog and fast-tracks rider dispatch
                prepEffective = Math.max(5, order.prepTime - 6);
                dispatchBoost = 3;
            }

            const estimatedDeliveryTime = prepEffective + travelTime + (isPrioritized ? Math.floor(workloadPenalty * 0.4) : workloadPenalty) + itemPenalty + (isPrioritized ? Math.min(partnerPenalty, 1) : partnerPenalty);

            let risk = 'LOW';
            if (estimatedDeliveryTime > SLA_TARGET + 5) risk = 'HIGH';
            else if (estimatedDeliveryTime >= SLA_TARGET - 2) risk = 'MEDIUM';
            else risk = 'LOW';

            const recommendations = [];
            if (risk === 'HIGH') {
                recommendations.push('Assign nearest dedicated delivery partner');
                recommendations.push('Prioritize queue in store dispatch station');
                recommendations.push('Proactively update customer ETA to prevent friction');
            } else if (risk === 'MEDIUM') {
                recommendations.push('Pre-reserve next incoming rider');
                recommendations.push('Monitor packaging progress closely');
            } else {
                recommendations.push('Optimal operational flow — on target for SLA');
            }

            return {
                ...order,
                travelTime,
                workloadPenalty,
                itemPenalty,
                partnerPenalty,
                prepEffective,
                estimatedDeliveryTime,
                slaTarget: SLA_TARGET,
                delayDelta: estimatedDeliveryTime - SLA_TARGET,
                risk,
                recommendations,
                isPrioritized
            };
        };

        // </logic>

        // Catches render errors so the dashboard never white-screens
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { failed: false }; }
            static getDerivedStateFromError() { return { failed: true }; }
            componentDidCatch(err) { console.error('SmartOps render error:', err); }
            render() {
                if (!this.state.failed) return this.props.children;
                return (
                    <div role="alert" className="min-h-screen flex flex-col items-center justify-center gap-3 text-center p-6">
                        <h1 className="text-xl font-bold">Something went wrong</h1>
                        <button onClick={() => location.reload()} className="px-4 py-2 bg-indigo-600 rounded-xl text-sm font-bold">Reload dashboard</button>
                    </div>
                );
            }
        }

        // --- APP ROOT COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('Overview');
            const [toasts, setToasts] = useState([]);
            const [demoGuideOpen, setDemoGuideOpen] = useState(false);

            // Inventory State
            const [isInventoryAnalyzed, setIsInventoryAnalyzed] = useState(false);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [products, setProducts] = useState(initialProductsRaw);

            // Delivery State
            const [orders, setOrders] = useState(() => {
                const initial = initialOrdersData.map(o => computeDeliveryPrediction(o, false));
                return sortByRisk(initial);
            });

            // Simulator State
            const [stockoutReduction, setStockoutReduction] = useState(40);
            const [delayReduction, setDelayReduction] = useState(30);

            // Toast Trigger
            const timers = useRef(new Set());
            useEffect(() => () => timers.current.forEach(clearTimeout), []);
            const later = (fn, ms) => { const t = setTimeout(() => { timers.current.delete(t); fn(); }, ms); timers.current.add(t); };

            const triggerToast = (msg, type = 'info') => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev.slice(-3), { id, msg, type }]);
                later(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
            };

            // Run Inventory Analysis
            const handleAnalyzeInventory = () => {
                if (isAnalyzing) return;
                setIsAnalyzing(true);
                later(() => {
                    try {
                        // Analyze current state so earlier restocks/delists are preserved
                        setProducts(prev => sortByRisk(prev.map(p => computeInventoryPrediction(p, 3))));
                        setIsInventoryAnalyzed(true);
                        triggerToast(`Demand intelligence calculated for all ${products.length} store SKUs`, 'success');
                    } catch (err) {
                        console.error(err);
                        triggerToast('Analysis failed: invalid sales history', 'warning');
                    } finally {
                        setIsAnalyzing(false);
                    }
                }, 900);
            };

            // Mark For Restock
            const handleRestockProduct = (productId, productName, qty) => {
                if (!isValidQty(qty)) { triggerToast('Invalid restock quantity', 'warning'); return; }
                setProducts(prev => prev.map(p => {
                    if (p.id === productId) {
                        return { ...p, status: 'RESTOCK ORDERED', currentStock: p.currentStock + qty, risk: 'LOW', riskColor: 'green', action: 'STOCK HEALTHY' };
                    }
                    return p;
                }));
                triggerToast(`Restock PO issued for ${productName} (+${qty} units)`, 'success');
            };

            // Mark Unavailable
            const handleMarkUnavailable = (productId, productName) => {
                setProducts(prev => prev.map(p => {
                    if (p.id === productId) {
                        return { ...p, status: 'MARKED UNAVAILABLE', action: 'CATALOG PAUSED' };
                    }
                    return p;
                }));
                triggerToast(`Temporarily delisted ${productName} to prevent customer bounce`, 'warning');
            };

            // Prioritize Delivery Order
            const handlePrioritizeOrder = (orderId) => {
                const target = orders.find(o => o.id === orderId);
                if (!target || target.isPrioritized) return;
                const after = computeDeliveryPrediction(target, true);
                setOrders(prev => sortByRisk(prev.map(o => (o.id === orderId ? after : o))));
                triggerToast(`Priority dispatch activated for Order #${orderId} (-${target.estimatedDeliveryTime - after.estimatedDeliveryTime} min ETA)`, 'success');
            };

            // Calculate Dynamic KPIs
            const highRiskInventoryCount = useMemo(() => {
                if (!isInventoryAnalyzed) return 7;
                return products.filter(p => p.risk === 'HIGH' && p.status !== 'RESTOCK ORDERED' && p.status !== 'MARKED UNAVAILABLE').length;
            }, [products, isInventoryAnalyzed]);

            const delayRiskOrdersCount = useMemo(() => {
                return orders.filter(o => o.risk === 'HIGH' && !o.isPrioritized).length;
            }, [orders]);

            const preventedCancellationsCount = useMemo(() => {
                const restocked = products.filter(p => p.status === 'RESTOCK ORDERED').length * 4;
                const unavail = products.filter(p => p.status === 'MARKED UNAVAILABLE').length * 3;
                const prioritized = orders.filter(o => o.isPrioritized).length * 5;
                return 18 + restocked + unavail + prioritized;
            }, [products, orders]);

            return (
                <div className="min-h-screen flex flex-col bg-[#090d16] text-slate-100 selection:bg-indigo-600 selection:text-white">
                    {/* Floating Toast Notifications */}
                    <div role="status" aria-live="polite" className="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none">
                        {toasts.map(t => (
                            <div key={t.id} className="toast-enter pointer-events-auto bg-slate-900/95 border border-slate-700/80 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 backdrop-blur-md">
                                <span className="text-xl">
                                    {t.type === 'success' ? '⚡' : t.type === 'warning' ? '⚠️' : 'ℹ️'}
                                </span>
                                <span className="text-sm font-medium">{t.msg}</span>
                            </div>
                        ))}
                    </div>

                    {/* Top Header & Navigation */}
                    <header className="sticky top-0 z-40 bg-[#0c1221]/90 backdrop-blur-md border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex flex-col md:flex-row md:items-center justify-between py-3 gap-3">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-amber-500 flex items-center justify-center font-black text-xl shadow-lg shadow-indigo-600/30">
                                            N
                                        </div>
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <span className="font-extrabold text-lg tracking-tight text-white">NOVA CART</span>
                                                <span className="bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-[11px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider flex items-center gap-1">
                                                    <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 pulse-badge"></span> SmartOps
                                                </span>
                                            </div>
                                            <p className="text-xs text-slate-400 hidden sm:block">"Predict problems before they become cancelled orders."</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setDemoGuideOpen(!demoGuideOpen)}
                                        className="md:hidden text-xs bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 px-3 py-1.5 rounded-lg flex items-center gap-1"
                                    >
                                        🎙️ 2-Min Demo
                                    </button>
                                </div>

                                <div className="flex items-center gap-2 sm:gap-3 overflow-x-auto pb-1 md:pb-0">
                                    <nav aria-label="Dashboard sections" className="flex space-x-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                                        {['Overview', 'Inventory', 'Delivery', 'Impact', 'Why SmartOps?'].map(tab => (
                                            <button
                                                key={tab}
                                                aria-current={activeTab === tab ? 'page' : undefined}
                                                onClick={() => setActiveTab(tab)}
                                                className={`whitespace-nowrap px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all ${
                                                    activeTab === tab
                                                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                                                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                                                }`}
                                            >
                                                {tab === 'Inventory' && '📦 '}
                                                {tab === 'Delivery' && '⚡ '}
                                                {tab === 'Impact' && '📈 '}
                                                {tab === 'Why SmartOps?' && '🎯 '}
                                                {tab}
                                            </button>
                                        ))}
                                    </nav>

                                    <button 
                                        onClick={() => setDemoGuideOpen(!demoGuideOpen)}
                                        className="hidden md:flex items-center gap-1.5 text-xs font-bold bg-amber-500/10 border border-amber-500/30 text-amber-300 hover:bg-amber-500/20 px-3 py-2 rounded-xl transition-all"
                                    >
                                        <span>🎙️</span> 2-Min Pitch Guide
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Demo Pitch Guide Drawer / Banner */}
                    {demoGuideOpen && (
                        <div className="bg-gradient-to-r from-indigo-950 via-slate-900 to-slate-950 border-b border-indigo-500/30 px-4 py-3 text-xs sm:text-sm transition-all fade-in">
                            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
                                <div className="flex items-start gap-2">
                                    <span className="text-xl">📋</span>
                                    <div>
                                        <span className="font-bold text-amber-400 uppercase tracking-wider text-xs">Hackathon 2-Minute Demo Script:</span>
                                        <p className="text-slate-300 text-xs mt-0.5">
                                            <strong>Step 1:</strong> Overview (Cite 6%→11% cancel spike) → <strong>Step 2:</strong> Inventory (Click <em>"Analyze Inventory"</em> → Restock Milk 1L) → <strong>Step 3:</strong> Delivery (Show Order #ORD-1048 → Click <em>"Prioritize Order"</em>) → <strong>Step 4:</strong> Customer Preview (Demonstrate honest 34m ETA) → <strong>Step 5:</strong> Impact Simulator (Show ₹4.8L+ saved).
                                        </p>
                                    </div>
                                </div>
                                <button aria-label="Dismiss demo guide" onClick={() => setDemoGuideOpen(false)} className="text-slate-400 hover:text-white text-xs px-2 py-1 rounded bg-slate-800">
                                    Dismiss ✕
                                </button>
                            </div>
                        </div>
